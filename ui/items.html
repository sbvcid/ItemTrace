<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="page.title_items">商品 · ItemTrace</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>

<header class="topbar">
  <a class="topbar-brand" href="/">
    <span class="brand-mark">IT</span>
    <span>ItemTrace</span>
  </a>
  <nav class="topbar-nav" aria-label="Main Navigation">
    <a class="nav-link" href="/" data-i18n="nav.inbox">Inbox</a>
    <a class="nav-link active" href="/items" data-i18n="items.title">商品</a>
    <a class="nav-link" href="/settings" data-i18n="nav.settings">設定</a>
  </nav>
  <span class="grow"></span>
  <div class="lang-switch" role="group" aria-label="Language">
    <button type="button" class="lang-btn" data-lang="zh-TW">中文</button>
    <span class="lang-sep" aria-hidden="true">|</span>
    <button type="button" class="lang-btn" data-lang="en">EN</button>
  </div>
</header>

<main class="wrap">

  <!-- 物品索引庫搜尋與篩選列 -->
  <div class="filters">
    <input id="q" type="search" autocomplete="off"
           data-i18n-placeholder="items.search_placeholder"
           placeholder="搜尋：名稱、品牌、規格、序號後半段…">
    <div class="row">
      <!-- 「商品狀態」為 items.status 的歸檔生命週期（active / archived / void） -->
      <select id="f-status">
        <option value="" data-i18n="items.filter_item_status">全部商品狀態</option>
      </select>
      <select id="f-category">
        <option value="" data-i18n="items.filter_type">全部類型</option>
      </select>
    </div>
  </div>

  <div id="error"></div>

  <!-- 物品列表清單容器 -->
  <div class="rows" id="rows"></div>
  <div class="empty" id="empty" hidden data-i18n="items.empty">沒有符合的商品</div>

  <!-- 分頁控制項 -->
  <div class="pager">
    <button id="prev" data-i18n="items.prev">上一頁</button>
    <span id="pageinfo"></span>
    <button id="next" data-i18n="items.next">下一頁</button>
  </div>

  <!-- 總數與筆數範圍提示 -->
  <p class="dim" id="count" style="margin:0 0 12px; text-align:center"></p>

</main>

<script src="/static/i18n.js"></script>
<script src="/static/api.js"></script>
<script src="/static/list.js"></script>
</body>
</html>
