<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="page.title_printing">列印設定 · ItemTrace</title>
<link rel="stylesheet" href="/static/app.css">
<style>
/* 頁面特定排版結構 */
table.templates { width: 100%; border-collapse: collapse; margin-top: 12px; }
table.templates th, table.templates td {
    text-align: left;
    padding: 10px;
    border-bottom: 1px solid var(--line);
    font-size: 13.5px;
    vertical-align: middle;
}
table.templates th { color: var(--muted); font-weight: 500; font-size: 12.5px; }
.row-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.row-actions button { padding: 4px 10px; font-size: 12px; }
.hint { color: var(--muted); font-size: 13px; margin: 6px 0 0; }
.inline-form { display: grid; gap: 12px; }
.inline-form textarea { min-height: 120px; font-family: var(--font-mono); font-size: 13px; }
.hidden { display: none !important; }
.preview-controls {
    display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-top: 12px;
}
.preview-controls select { width: auto; min-width: 180px; }
</style>
</head>
<body>

<header class="topbar">
  <a class="topbar-brand" href="/">
    <span class="brand-mark">IT</span>
    <span>ItemTrace</span>
  </a>
  <nav class="topbar-nav" aria-label="Main Navigation">
    <a class="nav-link" href="/settings"><span aria-hidden="true">&larr;</span> <span data-i18n="nav.item_detail">返回</span></a>
    <a class="nav-link" href="/" data-i18n="nav.inbox">Inbox</a>
    <a class="nav-link" href="/items" data-i18n="items.title">商品</a>
    <a class="nav-link" href="/settings" data-i18n="nav.settings">設定</a>
    <a class="nav-link active" href="/settings/printing" data-i18n="printing.title">列印設定</a>
  </nav>
  <span class="grow"></span>
  <div class="lang-switch" role="group" aria-label="Language">
    <button type="button" class="lang-btn" data-lang="zh-TW">中文</button>
    <span class="lang-sep" aria-hidden="true">|</span>
    <button type="button" class="lang-btn" data-lang="en">EN</button>
  </div>
</header>

<main class="wrap">

  <!-- 列印預設值設定 -->
  <section class="card">
    <h2 data-i18n="printing.settings_title">列印設定</h2>
    <div id="print-settings-error" class="print-error" hidden></div>
    <p class="hint" data-i18n="printing.settings_intro">商品頁按「列印」時，會先用這裡的預設值。印表機來自這台電腦（跑 server 的那台），不是手機自己的。</p>

    <div class="grid2" style="margin-top:14px">
      <div class="field">
        <label for="setting-printer" data-i18n="printing.default_printer">預設印表機</label>
        <select id="setting-printer"></select>
      </div>
      <div class="field">
        <label for="setting-template" data-i18n="printing.default_template">預設範本</label>
        <select id="setting-template"></select>
      </div>
    </div>

    <div class="actions">
      <button class="primary" id="save-print-settings" data-i18n="printing.save">儲存</button>
      <button id="print-open" data-i18n="printing.try_print">試印…</button>
    </div>
    <div class="status" id="print-settings-status"></div>
  </section>

  <!-- 標籤範本管理 -->
  <section class="card" style="margin-top:16px">
    <h2 data-i18n="template.manager_title">範本管理</h2>

    <div style="overflow-x:auto">
      <table class="templates">
        <thead><tr>
          <th data-i18n="template.column_id">ID</th>
          <th data-i18n="template.column_name">名稱</th>
          <th data-i18n="template.column_width">寬</th>
          <th data-i18n="template.column_height">高</th>
          <th data-i18n="template.column_created">建立時間</th>
          <th data-i18n="template.column_updated">更新時間</th>
          <th></th>
        </tr></thead>
        <tbody id="template-rows"></tbody>
      </table>
    </div>

    <!-- 編輯既有範本 -->
    <div id="template-editor" class="card-elevated" style="margin-top:16px" hidden>
      <h3><span data-i18n="template.edit_title">編輯範本</span> <span class="dim" id="edit-id"></span></h3>
      <div class="field">
        <label for="edit-name" data-i18n="template.name_label">名稱</label>
        <input id="edit-name">
      </div>
      <div class="field">
        <label for="edit-html" data-i18n="template.html_label">HTML</label>
        <textarea id="edit-html" rows="10" spellcheck="false"></textarea>
      </div>
      <div class="grid2">
        <div class="field">
          <label for="edit-width" data-i18n="template.width_label">寬度</label>
          <input id="edit-width" type="number" step="0.1">
        </div>
        <div class="field">
          <label for="edit-height" data-i18n="template.height_label">高度</label>
          <input id="edit-height" type="number" step="0.1">
        </div>
        <div class="field">
          <label for="edit-unit" data-i18n="template.unit_label">單位</label>
          <input id="edit-unit" value="mm">
        </div>
      </div>
      <div class="actions">
        <button class="primary" id="edit-save" data-i18n="template.edit_save">儲存變更</button>
        <button id="edit-cancel" data-i18n="template.edit_cancel">取消</button>
      </div>
    </div>

    <!-- 新增範本 -->
    <h3 style="margin-top:24px" data-i18n="template.create_title">新增範本</h3>
    <form class="inline-form" id="create-template-form">
      <div class="field">
        <label for="template-name" data-i18n="template.name_label">名稱</label>
        <input id="template-name" required>
      </div>
      <div class="field">
        <label for="template-html" data-i18n="template.html_label">HTML</label>
        <textarea id="template-html" spellcheck="false"
                  placeholder="&lt;!doctype html&gt; ..."></textarea>
        <span class="hint" data-i18n="template.mm_hint">尺寸欄留空就用範本自己 CSS 裡的 @page；填了就以這裡為準（列印時會覆蓋範本自訂的 @page）。</span>
      </div>
      <div class="grid2">
        <div class="field">
          <label for="template-width" data-i18n="template.width_label">寬度</label>
          <input id="template-width" type="number" step="0.1" placeholder="100">
        </div>
        <div class="field">
          <label for="template-height" data-i18n="template.height_label">高度</label>
          <input id="template-height" type="number" step="0.1" placeholder="150">
        </div>
        <div class="field">
          <label for="template-unit" data-i18n="template.unit_label">單位</label>
          <input id="template-unit" value="mm">
        </div>
      </div>
      <div><button class="primary" type="submit" data-i18n="template.create">新增範本</button></div>
    </form>
  </section>

  <!-- 範本預覽（即時渲染） -->
  <section class="card" style="margin-top:16px">
    <h2 data-i18n="template.preview_title">範本預覽</h2>
    <div class="preview-controls">
      <span class="hint" id="preview-template-id" style="margin:0"></span>
      <label for="preview-item" style="margin:0" data-i18n="template.preview_item_label">商品</label>
      <select id="preview-item"></select>
    </div>
    <div id="preview-empty" class="hint"></div>
    <div id="preview-frame" class="print-preview"
         data-i18n-aria-label="print.preview"></div>
  </section>

</main>

<!-- 共用列印對話框 -->
<section id="print-dialog" class="card" style="margin:16px 14px;" hidden>
  <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
    <h2 data-i18n="print.title">列印</h2>
    <button id="print-close" type="button" data-i18n="print.close">關閉</button>
  </div>

  <div style="margin-top:12px">
    <div class="grid2">
      <div class="field">
        <label for="print-item" data-i18n="print.item_label">商品</label>
        <select id="print-item"></select>
      </div>
      <div class="field">
        <label for="print-template" data-i18n="print.template_label">範本</label>
        <select id="print-template"></select>
      </div>
    </div>
    <div class="field">
      <label for="print-printer" data-i18n="print.printer_label">印表機</label>
      <select id="print-printer"></select>
    </div>
    <p class="hint" id="print-size"></p>
  </div>

  <div id="print-preview" class="print-preview"
       data-i18n-aria-label="print.preview"></div>
  <p class="print-error" id="print-error"></p>
  <div class="actions">
    <button class="primary" id="print-confirm" data-i18n="print.submit">列印 1 份</button>
  </div>
</section>

<script src="/static/i18n.js"></script>
<script src="/static/print_dialog.js"></script>
<script src="/static/printing_settings.js"></script>
</body>
</html>
